<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re:Create | 麗陵祭</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Zen+Kaku+Gothic+New:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: Arial, "Kosugi Maru", sans-serif;
        color: #fff;
        background:
          radial-gradient(ellipse 72% 58% at 12% 24%, rgba(72, 110, 235, 0.152), transparent 72%),
          radial-gradient(ellipse 70% 60% at 88% 72%, rgba(74, 222, 215, 0.108), transparent 72%),
          #080b18;
        background-attachment: fixed;
      }

      .hero {
        min-height: 100vh;
        min-height: 100svh;
      }

      .hero {
        position: relative;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 24px;
        transform: translateY(-30px);
        animation: hero-fade-in 2s ease-out 0.2s both;
      }

      .subhero {
        color: #ffffff9c;
        animation: hero-fade-in 1.5s ease-out 1s both;
      }

      @keyframes hero-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero,
        .subhero {
          animation: none;
        }
      }

      .hero h1 {
        margin: 0;
        font-family: "Zen Kaku Gothic New", Arial, sans-serif;
        font-size: clamp(4rem, 12vw, 8rem);
        color: #fff;
      }

      .hero p {
        margin: 4px 0 0;
        font-size: clamp(1.25rem, 3vw, 2rem);
      }

      .games-section {
        padding: 24px 0 48px;
      }


      .game-card {
        padding: 10px 0 120px;
      }

      @keyframes game-card-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes game-card-rise-in {
        from {
          transform: translateY(100px);
        }
        to {
          transform: translateY(0);
        }
      }

      @keyframes game-card-fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes game-card-rise-out {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-100px);
        }
      }

      @supports (animation-timeline: view()) {
        .game-card > .game-banner,
        .game-card > h3,
        .game-card > .game-genre,
        .game-card > .game-gallery > .gallery-main,
        .game-card > .game-gallery > .gallery-thumbnails,
        .game-card > p:not(.game-genre) {
          animation-name:
            game-card-fade-in,
            game-card-rise-in,
            game-card-fade-out,
            game-card-rise-out;
          animation-timing-function: linear, linear, linear, linear;
          animation-fill-mode: both, both, none, none;
          animation-timeline:
            view(block),
            view(block),
            view(block),
            view(block);
          animation-range:
            entry 75% cover 25%,
            entry 25% cover 20%,
            exit 0% exit 50%,
            exit 0% exit 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .game-card > .game-banner,
        .game-card > h3,
        .game-card > .game-genre,
        .game-card > .game-gallery > .gallery-main,
        .game-card > .game-gallery > .gallery-thumbnails,
        .game-card > p:not(.game-genre) {
          animation: none;
        }
      }

      .game-banner {
        width: min(90vw, 960px);
        aspect-ratio: 16 / 4;
        margin: 80px auto 16px;
        border: 1px solid currentColor;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.04);
        background-color: #101426;
        display: grid;
        place-items: center;
        text-align: center;
      }
      
      .game-banner p {
        font-size: 128px;
        font-weight: bold;
        text-align: center;
        font-family: Arial, "Kosugi Maru", sans-serif;
      }

      .game-card .game-banner p {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 3rem);
        font-weight: 700;
        line-height: 1.2;
      }

      .game-card h3 {
        margin: 0 24px;
        text-align: center;
        font-family: Arial, "Kosugi Maru", sans-serif;
        font-size: clamp(2.5rem, 9vw, 5rem);
      }

      .game-card .game-genre {
        width: fit-content;
        max-width: calc(100% - 48px);
        margin: 12px auto 0;
        padding: 0;
        text-align: center;
        font-size: clamp(1rem, 3vw, 1.5rem);
      }

      .game-genre + .game-gallery {
        margin-top: 16px;
      }

      .game-card p {
        max-width: 36rem;
        margin: 16px auto 24px;
        padding: 30px 24px 40px;
        text-align: center;
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        line-height: 1.8;
      }

      .site-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .site-footer p {
        margin-bottom: 24px;
        opacity: 0.5;
        font-size: clamp(0.75rem, 2vw, 1rem);
      }

      .game-gallery {
        position: relative;
      }

      .gallery-choice {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .gallery-main {
        position: relative;
        width: min(95vw, 960px);
        aspect-ratio: 16 / 9;
        margin: 0 auto 4px;
        border-radius: 3px;
        background-color: #101426;
      }

      .gallery-photo {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        opacity: 0;
        background-color: #101426;
        background-image: var(--bg, none);
        background-size: cover;
        background-position: center;
        transition: opacity 0.5s ease;
      }

      .gallery-thumbnails {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 0 19px 12px;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: thin;
      }

      .gallery-thumbnails::-webkit-scrollbar-track {
        margin: 0 15%;
      }

      @media (min-width: 768px) {
        .gallery-thumbnails {
          justify-content: center;
        }
      }

      .game-image-placeholder {
        display: grid;
        flex: 0 0 min(35vw, 160px);
        place-items: center;
        aspect-ratio: 16 / 9;
        border: 1px solid currentColor;
        font-size: 1rem;
        scroll-snap-align: center;
        cursor: pointer;
        opacity: 0.4;
        filter: grayscale(0.2) blur(0.5px);
        transition: opacity 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      }

      #game-1-image-1:checked ~ .gallery-main .photo-1,
      #game-1-image-2:checked ~ .gallery-main .photo-2,
      #game-1-image-3:checked ~ .gallery-main .photo-3,
      #game-1-image-4:checked ~ .gallery-main .photo-4,
      #game-2-image-1:checked ~ .gallery-main .photo-1,
      #game-2-image-2:checked ~ .gallery-main .photo-2,
      #game-2-image-3:checked ~ .gallery-main .photo-3,
      #game-2-image-4:checked ~ .gallery-main .photo-4,
      #game-3-image-1:checked ~ .gallery-main .photo-1,
      #game-3-image-2:checked ~ .gallery-main .photo-2,
      #game-3-image-3:checked ~ .gallery-main .photo-3,
      #game-3-image-4:checked ~ .gallery-main .photo-4 {
        display: grid;
      }

      .gallery-photo.is-active {
        z-index: 2;
        opacity: 1;
      }

      .gallery-photo.is-underlay {
        display: grid;
        z-index: 1;
        opacity: 1;
        transition: none;
      }

      .gallery-nav-button {
        position: absolute;
        top: 50%;
        z-index: 3;
        display: grid;
        min-width: 44px;
        height: 84px;
        place-items: center;
        padding: 0;
        border: 0;
        color: #fff;
        background: transparent;
        font-family: Arial, sans-serif;
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 300;
        line-height: 1;
        cursor: pointer;
        opacity: 0.65;
        transform: translateY(-50%) scaleY(1.5) scaleX(0.8);
        transition: opacity 0.2s ease;
      }

      .gallery-nav-button:hover,
      .gallery-nav-button:focus-visible {
        opacity: 1;
      }

      .gallery-nav-button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      .gallery-nav-button--previous {
        left: 12px;
      }

      .gallery-nav-button--next {
        right: 12px;
      }

      @media (prefers-reduced-motion: reduce) {
        .gallery-photo,
        .gallery-nav-button {
          transition: none;
        }
      }

      #game-1-image-1:checked ~ .gallery-thumbnails label[for="game-1-image-1"],
      #game-1-image-2:checked ~ .gallery-thumbnails label[for="game-1-image-2"],
      #game-1-image-3:checked ~ .gallery-thumbnails label[for="game-1-image-3"],
      #game-1-image-4:checked ~ .gallery-thumbnails label[for="game-1-image-4"],
      #game-2-image-1:checked ~ .gallery-thumbnails label[for="game-2-image-1"],
      #game-2-image-2:checked ~ .gallery-thumbnails label[for="game-2-image-2"],
      #game-2-image-3:checked ~ .gallery-thumbnails label[for="game-2-image-3"],
      #game-2-image-4:checked ~ .gallery-thumbnails label[for="game-2-image-4"],
      #game-3-image-1:checked ~ .gallery-thumbnails label[for="game-3-image-1"],
      #game-3-image-2:checked ~ .gallery-thumbnails label[for="game-3-image-2"],
      #game-3-image-3:checked ~ .gallery-thumbnails label[for="game-3-image-3"],
      #game-3-image-4:checked ~ .gallery-thumbnails label[for="game-3-image-4"] {
        position: relative;
        z-index: 1;
        border: 4px solid #60aaff;
        opacity: 1;
        filter: none;
      }

      @media (min-width: 1024px) {
        .game-banner {
          width: min(40vw, 880px);
        }

        .gallery-main {
          width: min(44vw, 920px);
        }

        .game-card .game-banner p {
          font-size: clamp(1.5rem, 2.7vw, 2.7rem);
        }

        .game-card h3 {
          font-size: clamp(2.25rem, 8vw, 4.5rem);
        }

        .game-image-placeholder {
          flex-basis: min(32vw, 145px);
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <h1>Re:Create</h1>
      <p class="subhero">麗陵祭 ゲーム展示</p>
      <p class="subhero">10.31~11.1</p>
    </header>

    <main>
      <section class="games-section" id="games" aria-labelledby="games-heading">

        <article class="game-card" id="game-1">
          <div class="game-banner" aria-label="ゲーム１のバナー">
            <p>タイトルバナー１</p>
          </div>
          <p class="game-genre">（ジャンル）</p>
          <div class="game-gallery" aria-label="ゲーム 1 のプレイ画像">
            <input class="gallery-choice" type="radio" name="game-1-gallery" id="game-1-image-1" checked />
            <input class="gallery-choice" type="radio" name="game-1-gallery" id="game-1-image-2" />
            <input class="gallery-choice" type="radio" name="game-1-gallery" id="game-1-image-3" />
            <input class="gallery-choice" type="radio" name="game-1-gallery" id="game-1-image-4" />
            <div class="gallery-main">
              <div class="gallery-photo photo-1">大きい画像 1</div>
              <div class="gallery-photo photo-2" style="--bg: url('img/img3.gif');"></div>
              <div class="gallery-photo photo-3" style="--bg: url('img/img2.jpg');"></div>
              <div class="gallery-photo photo-4" style="--bg: url('img/img1.jpg');"></div>
              <button class="gallery-nav-button gallery-nav-button--previous" type="button" aria-label="前の画像">&lt;</button>
              <button class="gallery-nav-button gallery-nav-button--next" type="button" aria-label="次の画像">&gt;</button>
            </div>
            <div class="gallery-thumbnails" aria-label="画像を選択">
              <label class="game-image-placeholder" for="game-1-image-1">画像 1</label>
              <label class="game-image-placeholder" for="game-1-image-2">画像 2</label>
              <label class="game-image-placeholder" for="game-1-image-3">画像 3</label>
              <label class="game-image-placeholder" for="game-1-image-4">画像 4</label>
            </div>
          </div>
          <p>ゲームの内容や遊び方を簡単に紹介</p>
        </article>

        <article class="game-card" id="game-2">
          <div class="game-banner" aria-label="ゲーム２のバナー">
            <p>タイトルバナー２</p>
          </div>
          <p class="game-genre">（ジャンル）</p>
          <div class="game-gallery" aria-label="ゲーム 2 のプレイ画像">
            <input class="gallery-choice" type="radio" name="game-2-gallery" id="game-2-image-1" checked />
            <input class="gallery-choice" type="radio" name="game-2-gallery" id="game-2-image-2" />
            <input class="gallery-choice" type="radio" name="game-2-gallery" id="game-2-image-3" />
            <input class="gallery-choice" type="radio" name="game-2-gallery" id="game-2-image-4" />
            <div class="gallery-main">
              <div class="gallery-photo photo-1">大きい画像 1</div>
              <div class="gallery-photo photo-2">大きい画像 2</div>
              <div class="gallery-photo photo-3">大きい画像 3</div>
              <div class="gallery-photo photo-4">大きい画像 4</div>
              <button class="gallery-nav-button gallery-nav-button--previous" type="button" aria-label="前の画像">&lt;</button>
              <button class="gallery-nav-button gallery-nav-button--next" type="button" aria-label="次の画像">&gt;</button>
            </div>
            <div class="gallery-thumbnails" aria-label="画像を選択">
              <label class="game-image-placeholder" for="game-2-image-1">画像 1</label>
              <label class="game-image-placeholder" for="game-2-image-2">画像 2</label>
              <label class="game-image-placeholder" for="game-2-image-3">画像 3</label>
              <label class="game-image-placeholder" for="game-2-image-4">画像 4</label>
            </div>
          </div>
          <p>ゲームの内容や遊び方を簡単に紹介</p>
        </article>

        <article class="game-card" id="game-3">
          <div class="game-banner" aria-label="ゲーム３のバナー">
            <p>タイトルバナー３</p>
          </div>
          <p class="game-genre">（ジャンル）</p>
          <div class="game-gallery" aria-label="ゲーム 3 のプレイ画像">
            <input class="gallery-choice" type="radio" name="game-3-gallery" id="game-3-image-1" checked />
            <input class="gallery-choice" type="radio" name="game-3-gallery" id="game-3-image-2" />
            <input class="gallery-choice" type="radio" name="game-3-gallery" id="game-3-image-3" />
            <input class="gallery-choice" type="radio" name="game-3-gallery" id="game-3-image-4" />
            <div class="gallery-main">
              <div class="gallery-photo photo-1">大きい画像 1</div>
              <div class="gallery-photo photo-2">大きい画像 2</div>
              <div class="gallery-photo photo-3">大きい画像 3</div>
              <div class="gallery-photo photo-4">大きい画像 4</div>
              <button class="gallery-nav-button gallery-nav-button--previous" type="button" aria-label="前の画像">&lt;</button>
              <button class="gallery-nav-button gallery-nav-button--next" type="button" aria-label="次の画像">&gt;</button>
            </div>
            <div class="gallery-thumbnails" aria-label="画像を選択">
              <label class="game-image-placeholder" for="game-3-image-1">画像 1</label>
              <label class="game-image-placeholder" for="game-3-image-2">画像 2</label>
              <label class="game-image-placeholder" for="game-3-image-3">画像 3</label>
              <label class="game-image-placeholder" for="game-3-image-4">画像 4</label>
            </div>
          </div>
          <p>ゲームの内容や遊び方を簡単に紹介</p>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>Re:Create</p>
      <p>© 2026 麗陵祭</p>
      <p>CC BY-NC-SA 4.0</p>
    </footer>
    <script>
      document.querySelectorAll(".game-gallery").forEach((gallery) => {
        const choices = [...gallery.querySelectorAll(".gallery-choice")];
        const photos = choices.map((_, index) => gallery.querySelector(`.photo-${index + 1}`));
        const initiallySelected = choices.findIndex((choice) => choice.checked);
        let transitionId = 0;

        photos[initiallySelected]?.classList.add("is-active");

        gallery.querySelectorAll(".gallery-nav-button").forEach((button) => {
          button.addEventListener("click", () => {
            const currentIndex = choices.findIndex((choice) => choice.checked);
            if (currentIndex < 0) return;

            const direction = button.classList.contains("gallery-nav-button--next") ? 1 : -1;
            const nextIndex = (currentIndex + direction + choices.length) % choices.length;
            choices[nextIndex].checked = true;
            choices[nextIndex].dispatchEvent(new Event("change", { bubbles: true }));
          });
        });

        choices.forEach((choice, index) => {
          const thumbnail = gallery.querySelector(`label[for="${choice.id}"]`);

          thumbnail?.addEventListener("click", (event) => {
            event.preventDefault();
            if (choice.checked) return;

            choice.checked = true;
            choice.dispatchEvent(new Event("change", { bubbles: true }));
          });

          choice.addEventListener("change", () => {
            const thumbnailList = gallery.querySelector(".gallery-thumbnails");

            if (thumbnail && thumbnailList) {
              const thumbnailRect = thumbnail.getBoundingClientRect();
              const listRect = thumbnailList.getBoundingClientRect();
              const targetScrollLeft =
                thumbnailList.scrollLeft +
                thumbnailRect.left +
                thumbnailRect.width / 2 -
                listRect.left -
                listRect.width / 2;

              thumbnailList.scrollTo({ left: targetScrollLeft, behavior: "smooth" });
            }

            const outgoingPhoto = gallery.querySelector(".gallery-photo.is-active");
            const incomingPhoto = photos[index];

            if (!incomingPhoto || incomingPhoto === outgoingPhoto) return;

            transitionId += 1;
            gallery.querySelectorAll(".gallery-photo.is-underlay").forEach((photo) => {
              photo.classList.remove("is-underlay");
            });

            if (outgoingPhoto) {
              outgoingPhoto.classList.remove("is-active");
              outgoingPhoto.classList.add("is-underlay");
              const currentTransitionId = transitionId;

              const finishTransition = (event) => {
                if (event && (event.target !== incomingPhoto || event.propertyName !== "opacity")) return;
                if (transitionId !== currentTransitionId || incomingPhoto !== gallery.querySelector(".gallery-photo.is-active")) return;
                outgoingPhoto.classList.remove("is-underlay");
              };

              incomingPhoto.addEventListener("transitionend", finishTransition, { once: true });
              window.setTimeout(() => finishTransition(), 750);
            }

            incomingPhoto.classList.remove("is-underlay");
            requestAnimationFrame(() => incomingPhoto.classList.add("is-active"));
          });
        });

        choices.forEach((choice, index) => {
          const photo = gallery.querySelector(`.photo-${index + 1}`);
          const thumbnail = gallery.querySelector(`label[for="${choice.id}"]`);

          if (!photo || !thumbnail) return;

          const image = getComputedStyle(photo).backgroundImage;
          if (image === "none") return;

          thumbnail.style.backgroundSize = "cover";
          thumbnail.style.backgroundPosition = "center";
          thumbnail.style.color = "transparent";

          const imageUrl = image.match(/^url\(["']?(.*?)["']?\)$/)?.[1];
          if (!imageUrl || !/\.(gif|webp)$/i.test(new URL(imageUrl, document.baseURI).pathname)) {
            thumbnail.style.backgroundImage = image;
            return;
          }

          const source = new Image();
          source.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = source.naturalWidth;
            canvas.height = source.naturalHeight;
            canvas.getContext("2d").drawImage(source, 0, 0);
            thumbnail.style.backgroundImage = `url("${canvas.toDataURL("image/png")}")`;
          };
          source.onerror = () => {
            console.error(`썸네일 GIF를 불러오지 못했습니다: ${imageUrl}`);
          };
          source.src = imageUrl;
        });
      });

      const firstGameCard = document.querySelector("#game-1");
      if (firstGameCard && window.scrollY === 0) {
        const interactionEvents = ["pointerdown", "touchstart", "wheel", "keydown", "scroll"];
        let autoScrollTimer;

        const cancelAutoScroll = () => {
          window.clearTimeout(autoScrollTimer);
          interactionEvents.forEach((eventName) => {
            window.removeEventListener(eventName, cancelAutoScroll);
          });
        };

        interactionEvents.forEach((eventName) => {
          window.addEventListener(eventName, cancelAutoScroll, { once: true, passive: true });
        });

        autoScrollTimer = window.setTimeout(() => {
          cancelAutoScroll();
          firstGameCard.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 3500);
      }
    </script>
  </body>
</html>
